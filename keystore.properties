# Stable release signing key for Starmap.
#
# This key is committed on purpose: it is what lets the app update itself in
# place (Android only allows an update if the new APK is signed with the SAME
# certificate as the installed one). Because the repo is private, keeping the
# key here is an acceptable trade-off for zero-setup releases.
#
# For a public distribution, delete these and instead provide the key to CI via
# the RELEASE_STORE_FILE / RELEASE_STORE_PASSWORD / RELEASE_KEY_ALIAS /
# RELEASE_KEY_PASSWORD environment variables (GitHub Actions secrets), which the
# build prefers over this file.
storeFile=app/starmap-release.jks
storePassword=starmap
keyAlias=starmap
keyPassword=starmap
